name: Mosaic
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 6A4J2GTB6F
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
targets:
  Mosaic:
    type: application
    platform: iOS
    sources:
      # Prototype test photos are personal and must never ship in Release;
      # a Debug-only copy phase below puts them back for dev/screenshot runs.
      - path: Sources
        excludes:
          - Resources/Prototype/**
      # B8: the StoreKit test config has to be a MEMBER of the project or
      # Xcode cannot resolve the scheme's reference to it - it shows red in
      # Edit Scheme and local purchase testing silently falls through to the
      # real sandbox. `buildPhase: none` keeps it out of every target, so it
      # is visible to Xcode and never bundled into the shipping app.
      - path: Mosaic.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levelup.mosaic
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Mosaic
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Mosaic shows your photo library so you can pick photos for your collage. Nothing leaves your device.
        NSPhotoLibraryAddUsageDescription: Mosaic saves your finished collage to your photo library.
    postBuildScripts:
      - name: Copy prototype photos (Debug only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            mkdir -p "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            cp "$SRCROOT/Sources/Resources/Prototype/"*.jpg "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/" 2>/dev/null || true
          fi
schemes:
  Mosaic:
    build:
      targets:
        Mosaic: all
    run:
      config: Debug
      # B8: StoreKit 2 testing config (Mosaic.storekit at repo root) so
      # Simulator runs have a real, purchasable "Remove Watermark" product
      # without an App Store Connect record.
      storeKitConfiguration: ../Mosaic.storekit
    archive:
      config: Release
