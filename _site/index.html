<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0B0B0D;
    color: #E9E9EC;
    height: 100%;
  }
  body {
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px;
  }
  main { max-width: 420px; text-align: center; }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #FAFAFB;
    margin: 0 0 8px;
  }
  p { color: #8B8B93; margin: 0 0 32px; }
  .links {
    display: flex;
    gap: 14px;
    justify-content: center;
  }
  a {
    color: #FAFAFB;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 15px;
  }
  a:hover, a:focus {
    border-color: rgba(76,141,255,0.6);
    background: rgba(31,107,232,0.12);
  }
</style>
</head>
<body>
<main>
  <h1>Mosaic</h1>
  <p>Photo Collage &amp; Layout for iPhone</p>
  <div class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </div>
</main>
</body>
</html>
